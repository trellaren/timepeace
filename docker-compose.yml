services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: timepeace
      POSTGRES_PASSWORD: timepeace
      POSTGRES_DB: timepeace
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: timepeace
      MINIO_ROOT_PASSWORD: timepeace-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
  miniodata:
